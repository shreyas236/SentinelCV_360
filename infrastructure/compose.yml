name: sentinelcv
x-app-env: &app-env
  SENTINEL_STORAGE: postgres
  SENTINEL_DATABASE_URL: postgresql://sentinel:${SENTINEL_POSTGRES_PASSWORD:?Run init-stack.py}@postgres:5432/sentinel
  SENTINEL_SERVICE_TOKEN: ${SENTINEL_SERVICE_TOKEN:?Run init-stack.py}
  SENTINEL_S3_ENDPOINT: http://minio:9000
  SENTINEL_S3_ACCESS_KEY: sentinel
  SENTINEL_S3_SECRET_KEY: ${SENTINEL_MINIO_PASSWORD:?Run init-stack.py}
  SENTINEL_S3_BUCKET: sentinel
  SENTINEL_STORAGE_SERVICE_URL: http://storage:8767
  SENTINEL_AI_URL: http://ai-worker:8768
  SENTINEL_LEDGER_URL: http://fabric-gateway:8770
  SENTINEL_AUTH_MODE: keycloak
  SENTINEL_PUBLIC_URL: ${SENTINEL_PUBLIC_URL:-https://localhost:8443}
  SENTINEL_OIDC_ISSUER: ${SENTINEL_PUBLIC_URL:-https://localhost:8443}/idp/realms/sentinel
  SENTINEL_OIDC_INTERNAL_ISSUER: http://keycloak:8080/idp/realms/sentinel
  SENTINEL_OIDC_CLIENT_ID: sentinel-api
  SENTINEL_OIDC_CLIENT_SECRET: ${SENTINEL_OIDC_CLIENT_SECRET:?Run init-stack.py}
  KEYSTORE_SECRET: ${KEYSTORE_SECRET:?Run init-stack.py}
  SENTINEL_REDIS_URL: redis://:${SENTINEL_REDIS_PASSWORD:?Run init-stack.py}@redis:6379/0
  SENTINEL_API_INTERNAL_URL: http://api:8000
services:
  frontend:
    image: nginx:1.28-alpine
    ports: ["${SENTINEL_BIND_ADDRESS:-127.0.0.1}:8443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runtime/tls:/etc/sentinel/tls:ro
    depends_on: [api,keycloak]
    networks: [protected]
    read_only: true
    tmpfs: [/var/cache/nginx,/var/run]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  api:
    image: sentinel-api:1.1
    build: {context: ..,dockerfile: infrastructure/Dockerfile.api}
    environment: *app-env
    volumes: [api-data:/app/local-data]
    depends_on:
      storage: {condition: service_started}
      keycloak: {condition: service_started}
    networks: [protected]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  storage:
    image: sentinel-api:1.1
    command: [uvicorn,local.storage_service:app,--host,0.0.0.0,--port,"8767"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    networks: [protected]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  ai-worker:
    image: sentinel-ai:1.1
    build: {context: ..,dockerfile: infrastructure/Dockerfile.worker}
    environment:
      SENTINEL_SERVICE_TOKEN: ${SENTINEL_SERVICE_TOKEN}
      SENTINEL_ML_MEMORY_MB: "8192"
    volumes: [../model-vault:/models:ro]
    networks: [protected]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 9g
    cpus: 4
    restart: unless-stopped
  worker:
    image: sentinel-api:1.1
    command: [celery,-A,local.tasks:celery_app,worker,--loglevel=WARNING,--concurrency=2]
    environment: *app-env
    networks: [protected]
    depends_on: [redis,api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  postgres:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${SENTINEL_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/home/postgres/pgdata/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-sentinel.sql:ro
    healthcheck:
      test: [CMD-SHELL,"pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [protected]
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: [server,/data,--console-address,":9001"]
    environment:
      MINIO_ROOT_USER: sentinel
      MINIO_ROOT_PASSWORD: ${SENTINEL_MINIO_PASSWORD}
    volumes: [minio-data:/data]
    networks: [protected]
    restart: unless-stopped
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: [/bin/sh,-c]
    command:
      - 'until mc alias set local http://minio:9000 sentinel "$${SENTINEL_MINIO_PASSWORD}"; do sleep 2; done; mc mb --ignore-existing local/sentinel; mc version enable local/sentinel'
    environment: {SENTINEL_MINIO_PASSWORD: "${SENTINEL_MINIO_PASSWORD}"}
    networks: [protected]
    depends_on: [minio]
  redis:
    image: redis:7.4-alpine
    command: [/bin/sh,-c,'exec redis-server --appendonly yes --requirepass "$${SENTINEL_REDIS_PASSWORD}"']
    environment: {SENTINEL_REDIS_PASSWORD: "${SENTINEL_REDIS_PASSWORD}"}
    volumes: [redis-data:/data]
    networks: [protected]
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: [start,--import-realm]
    user: "${SENTINEL_UID:-1000}:${SENTINEL_GID:-1000}"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/sentinel
      KC_DB_USERNAME: sentinel
      KC_DB_PASSWORD: ${SENTINEL_POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HOSTNAME: ${SENTINEL_PUBLIC_URL:-https://localhost:8443}/idp
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: sentinel-root
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SENTINEL_KEYCLOAK_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes: [./runtime/realm.json:/opt/keycloak/data/import/sentinel-realm.json:ro]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [protected]
    restart: unless-stopped
  fabric-gateway:
    image: sentinel-fabric-gateway:1.1
    build: ./fabric/gateway
    environment:
      SENTINEL_SERVICE_TOKEN: ${SENTINEL_SERVICE_TOKEN}
      FABRIC_PEER_ENDPOINT: peer0.org1.example.com:7051
      FABRIC_PEER_HOST: peer0.org1.example.com
      FABRIC_CHANNEL: sentinel
      FABRIC_CHAINCODE: sentinel-anchor
      FABRIC_MSP_ID: Org1MSP
      FABRIC_TLS_CERT: /identities/peers/peer0.org1.example.com/tls/ca.crt
      FABRIC_CERTIFICATE: /identities/users/Admin@org1.example.com/msp/signcerts/cert.pem
      FABRIC_KEY_DIRECTORY: /identities/users/Admin@org1.example.com/msp/keystore
    volumes: [./vendor/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com:/identities:ro]
    networks: [protected,fabric]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.6.0
    user: "${SENTINEL_UID:-1000}:${SENTINEL_GID:-1000}"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./runtime/service-token:/run/secrets/service-token:ro
      - ./runtime/prometheus:/prometheus
    networks: [protected]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${SENTINEL_GRAFANA_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${SENTINEL_PUBLIC_URL:-https://localhost:8443}/monitor/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [protected]
    restart: unless-stopped
networks:
  protected: {internal: true}
  fabric: {external: true,name: fabric_test}
volumes:
  api-data:
  postgres-data:
  minio-data:
  redis-data:
  prometheus-data:
  grafana-data:
