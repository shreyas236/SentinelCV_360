# Support services only. The current prototype does NOT use these adapters.
# Configure secrets before starting; this is not a validated full Sentinel stack.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${SENTINEL_POSTGRES_PASSWORD:?Set a private database password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [protected]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: sentinel-admin
      MINIO_ROOT_PASSWORD: ${SENTINEL_MINIO_PASSWORD:?Set a private object-store password}
    volumes: [minio-data:/data]
    networks: [protected]
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    networks: [protected]
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: sentinel-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SENTINEL_KEYCLOAK_PASSWORD:?Set a private identity password}
    networks: [protected]
  prometheus:
    image: prom/prometheus:v3.6.0
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    networks: [protected]
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${SENTINEL_GRAFANA_PASSWORD:?Set a private dashboard password}
    volumes: [grafana-data:/var/lib/grafana]
    networks: [protected]
networks:
  protected:
    internal: true
volumes:
  postgres-data:
  minio-data:
  redis-data:
  grafana-data:
